name: Container image

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/ptp-monitor

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Python syntax check
        run: python3 -m py_compile ptp_monitor.py docker/healthcheck.py .github/scripts/collector_e2e.py

      - uses: docker/setup-buildx-action@v3

      # Build for this runner and prove the image works before publishing
      - name: Build test image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ptp-monitor:test

      - name: Smoke test
        run: |
          docker run -d --name ptp --cap-add NET_RAW --cap-add NET_ADMIN -p 8080:8080 ptp-monitor:test
          python3 .github/scripts/smoke_test.py
      - name: Container log
        if: always()
        run: docker logs ptp || true

      # The same image as a collector: HTTPS, login, node tokens, pushes (no capture needed)
      - name: Collector end-to-end test
        run: |
          docker run -d --name ptp-collector -e PTP_MODE=collector \
            -e PTP_ADMIN_PASSWORD=ci-admin-password-1 -p 8443:8443 ptp-monitor:test
          for i in $(seq 30); do curl -sk https://127.0.0.1:8443/healthz && break; sleep 1; done
          COLLECTOR=https://127.0.0.1:8443 ADMIN_PASSWORD=ci-admin-password-1 \
            python3 .github/scripts/collector_e2e.py
      - name: Collector container log
        if: always()
        run: docker logs ptp-collector || true

      # Publish (not for pull requests): linux/amd64, linux/arm64 (Raspberry Pi 3/4/5, 64-bit OS)
      # and linux/arm/v7 (32-bit Raspberry Pi OS)
      - uses: docker/setup-qemu-action@v3
        if: github.event_name != 'pull_request'
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        if: github.event_name != 'pull_request'
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=sha
      - name: Build and push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # Node image for Cisco Catalyst 9300/9300X (IOS XE Application Hosting): linux/amd64 only
  iox-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Build collector image (the standard image)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: ptp-collector:ci
      - name: Build node image (linux/amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.iox
          platforms: linux/amd64
          load: true
          tags: ptp-node:ci
      - name: Node pushes to a collector with a pinned certificate
        run: |
          set -e
          docker network create ptpnet
          docker run -d --name collector --network ptpnet -e PTP_MODE=collector \
            -e PTP_ADMIN_PASSWORD=ci-admin-password-1 ptp-collector:ci
          for i in $(seq 40); do docker exec collector python /app/healthcheck.py && break; sleep 1; done
          TOKEN=$(docker exec collector python /app/ptp_monitor.py --mode collector \
                    --data-dir /data --add-node ci-cat9300 | grep -o 'ptpn_[A-Za-z0-9_-]*')
          FP=$(docker logs collector 2>&1 | grep -o 'fingerprint: [0-9A-F:]*' | head -1 | cut -d' ' -f2)
          test -n "$TOKEN" && test -n "$FP"
          docker run -d --name node --network ptpnet --cap-add NET_RAW --cap-add NET_ADMIN \
            -e PTP_COLLECTOR_URL=https://collector:8443 -e PTP_NODE_TOKEN="$TOKEN" \
            -e PTP_COLLECTOR_FINGERPRINT="$FP" -e PTP_INTERFACES=eth0 ptp-node:ci
          for i in $(seq 40); do docker exec node python /app/healthcheck.py && ok=1 && break; sleep 1; done
          test "${ok:-0}" = 1
          docker image inspect ptp-node:ci --format '{{.Architecture}} {{.Size}}'
      - name: Logs
        if: always()
        run: docker logs collector || true; docker logs node || true
      - name: Save image tar for the switch
        run: |
          docker save ptp-node:ci -o ptp-node.tar
          sha256sum ptp-node.tar
      - uses: actions/upload-artifact@v4
        with:
          name: ptp-node-iox
          path: ptp-node.tar
          retention-days: 30

  # Raspberry Pi: build and run the image on 64-bit and 32-bit ARM (emulated with QEMU)
  arm-image:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [linux/arm64, linux/arm/v7]
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          load: true
          tags: ptp-arm:test
      - name: Which optional packages made it into the image
        run: |
          docker run --rm --platform ${{ matrix.platform }} --entrypoint python ptp-arm:test -c \
            "import platform,scapy;print(platform.machine(),'scapy',scapy.VERSION)
          for m in ('psutil','cryptography'):
              try: __import__(m);print(m,'yes')
              except ImportError: print(m,'no (fallback is used)')"
      - name: Collector end-to-end test on ARM
        run: |
          docker run -d --name arm-collector --platform ${{ matrix.platform }} -e PTP_MODE=collector \
            -e PTP_ADMIN_PASSWORD=ci-admin-password-1 -p 8443:8443 ptp-arm:test
          for i in $(seq 90); do curl -sk https://127.0.0.1:8443/healthz && break; sleep 2; done
          COLLECTOR=https://127.0.0.1:8443 ADMIN_PASSWORD=ci-admin-password-1 \
            python3 .github/scripts/collector_e2e.py
      - name: Standalone starts on ARM
        run: |
          docker run -d --name arm-standalone --platform ${{ matrix.platform }} \
            --cap-add NET_RAW --cap-add NET_ADMIN -p 8080:8080 ptp-arm:test
          for i in $(seq 90); do curl -sf http://127.0.0.1:8080/api/state >/dev/null && ok=1 && break; sleep 2; done
          test "${ok:-0}" = 1
      - name: Logs
        if: always()
        run: docker logs arm-collector || true; docker logs arm-standalone || true
