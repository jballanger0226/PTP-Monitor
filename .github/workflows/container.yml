name: Container image

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/ptp-monitor

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Python syntax check
        run: python3 -m py_compile ptp_monitor.py docker/healthcheck.py .github/scripts/collector_e2e.py

      - uses: docker/setup-buildx-action@v3

      # Build for this runner and prove the image works before publishing
      - name: Build test image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ptp-monitor:test

      - name: Smoke test
        run: |
          docker run -d --name ptp --cap-add NET_RAW --cap-add NET_ADMIN -p 8080:8080 ptp-monitor:test
          python3 .github/scripts/smoke_test.py
      - name: Container log
        if: always()
        run: docker logs ptp || true

      # The same image as a collector: HTTPS, login, node tokens, pushes (no capture needed)
      - name: Collector end-to-end test
        run: |
          docker run -d --name ptp-collector -e PTP_MODE=collector \
            -e PTP_ADMIN_PASSWORD=ci-admin-password-1 -p 8443:8443 ptp-monitor:test
          for i in $(seq 30); do curl -sk https://127.0.0.1:8443/healthz && break; sleep 1; done
          COLLECTOR=https://127.0.0.1:8443 ADMIN_PASSWORD=ci-admin-password-1 \
            python3 .github/scripts/collector_e2e.py
      - name: Collector container log
        if: always()
        run: docker logs ptp-collector || true

      # Publish (not for pull requests): linux/amd64 + linux/arm64
      - uses: docker/setup-qemu-action@v3
        if: github.event_name != 'pull_request'
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        if: github.event_name != 'pull_request'
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=sha
      - name: Build and push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
